plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nyangmeong'
version = '0.0.1-SNAPSHOT'
description = 'Nyangmeong Care backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 채팅 실시간(global/config/WebSocketConfig). STOMP over WebSocket, 내장 브로커
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// 인증번호 메일 SMTP 발송(global/mail/SmtpMailSender). app.mail.client=smtp 일 때만 쓰고, 버전은 Boot 관리
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	implementation 'com.github.pagehelper:pagehelper-spring-boot-starter:4.1.1'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	// JWT 발급·검증(global/security/jwt). Spring Security 내장 NimbusJwtEncoder/Decoder, 버전은 Boot 관리
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	// SQL 로그(global/config/Log4jdbcConfig). 바인딩 값이 채워진 SQL과 결과 표를 찍는다. prod 프로필에서는 쓰지 않는다
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	/** 테스트 JVM을 코어 절반(최대 4개)만큼 나눠 실행 : CI(4코어)는 2개, -PtestForks=N으로 바꿈 */
	maxParallelForks = (findProperty('testForks') ?: Math.min(4, Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))) as int
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8'
}