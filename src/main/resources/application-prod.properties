# 공통
logging.level.com.nyangmeong=info

# Swagger(OpenAPI) 끄기. 운영에서 API 문서를 공개하지 않는다
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# 파일 저장 루트(폴더와 쓰기 권한이 없으면 앱이 시작되지 않는다)
app.file.root-dir=/home/ggorilab/attachment

# 로그 파일 폴더(logback-spring.xml). prod는 반드시 적는다(없으면 시작 실패)
app.log.dir=/home/ggorilab/logs

# 케어미션 정산·출제 배치(SCR-MYP-020). 운영 서버에서만 켠다. 서버가 2대 이상이면 한 대만 켠다
app.care-mission.batch-enabled=true

# 뉴스 수집 배치(SCR-CMU-003). 운영 서버에서만 켠다. 서버가 2대 이상이면 한 대만 켠다
app.news.batch-enabled=true
# 목격 장소·돌봄 장소 좌표 -> 행정구역 변환(SCR-CMU-002·004). 운영은 카카오 로컬 API를 쓴다. 생략하면 fake라 모든 글이 전주시로 저장된다
# 카카오 키(app.kakao-local.rest-api-key)는 여기에 적지 않고 서버의 비공개 설정에 둔다. 키가 없으면 글 작성이 502다
app.region.client=kakao
